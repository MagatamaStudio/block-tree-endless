<!DOCTYPE html>
<html lang="zh-CN">
<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>方块树：无尽模组海 · Minecraft 放置游戏</title>
	<!-- 启动兜底：脚本没跑起来时不要留一块纯黑，直接把错误写在屏幕上 -->
	<script>
		window.__bootErr = false
		window.addEventListener("error", function (e) {
			window.__bootErr = true
			var b = document.getElementById("boot")
			if (!b) return
			var msg = (e && e.message) || "未知错误"
			var at = e && e.filename ? (e.filename.split("/").pop() + ":" + e.lineno) : ""
			try {
				var miss = []
				for (var k in layers) if (layers[k] && layers[k].row !== undefined && !player[k]) miss.push(k)
				if (miss.length) at += "　缺档层: " + miss.join(",")
			} catch (e2) {}
			b.innerHTML = '<div class="boot-fail"><b>加载失败</b><br>' +
				msg.replace(/</g, "&lt;") + "<br>" + at +
				'<br><br><span style="font-size:13px;opacity:.75">按 F12 打开控制台看堆栈，把红色那行发给我</span></div>'
		})
		// 层脚本是异步注入的 <script>：冷缓存下要几百毫秒才到齐，而 load() 会立刻按 layers
		// 造 player / tmp。谁先跑谁赢的竞态就是硬刷新黑屏的根源，这里直接等齐再启动。
		window.__bootDone = function () {
			if (window.__bootErr) return
			var b = document.getElementById("boot")
			if (b) b.remove()
		}
		window.boot = function () {
			window.__bootTimer = setTimeout(function () {
				if (window.__bootStarted) return
				console.warn("层脚本 8 秒未到齐，先启动");
				window.__bootStarted = true
				load(); window.__bootDone()
			}, 8000)
			if (window.mpAllLayersLoaded) {
				window.__bootStarted = true
				load(); window.__bootDone()
				return
			}
			window.mpAfterLayers = function () {
				if (window.__bootStarted) return
				window.__bootStarted = true
				clearTimeout(window.__bootTimer)
				load(); window.__bootDone()
			}
		}
	</script>

	<link rel="icon" type="image/png" href="img/favicon.png">

	<link rel="stylesheet" type="text/css" href="css/system-style.css?v=11.6.8" />
	<link rel="stylesheet" type="text/css" href="css/bars.css?v=11.6.8" />
	<link rel="stylesheet" type="text/css" href="css/components.css?v=11.6.8" />
	<link rel="stylesheet" type="text/css" href="css/general-style.css?v=11.6.8" />
	<link rel="stylesheet" type="text/css" href="css/misc.css?v=11.6.8" />
	<link rel="stylesheet" type="text/css" href="css/other-tabs.css?v=11.6.8" />
	<link rel="stylesheet" type="text/css" href="css/popup.css?v=11.6.8" />
	<link rel="stylesheet" type="text/css" href="css/tree-node.css?v=11.6.8" />
	<link rel="stylesheet" type="text/css" href="css/minecraft.css?v=11.6.8" />

	<!-- 字体外链改成非阻塞：国内直连 fonts.googleapis.com 会卡住首屏，硬刷新时整页黑屏 -->
	<link href="https://fonts.googleapis.com/css?family=Inconsolata" rel="stylesheet" media="print" onload="this.media='all'">

	<script src="js/technical/vue.min.js?v=11.6.8"></script>
	<script src="js/technical/break_eternity.js?v=11.6.8"></script>
	<script src="js/technical/layerSupport.js?v=11.6.8"></script>

	<script src="js/mod.js?v=11.6.8"></script>
	<script src="js/technical/loader.js?v=11.6.8"></script>

	<script src="js/technical/temp.js?v=11.6.8"></script>
	<script src="js/technical/displays.js?v=11.6.8"></script>
	
	<script src="js/game.js?v=11.6.8"></script>
	<script src="js/utils.js?v=11.6.8"></script>
	<script src="js/utils/easyAccess.js?v=11.6.8"></script>
	<script src="js/technical/systemComponents.js?v=11.6.8"></script>
	<script src="js/components.js?v=11.6.8"></script>
	<script src="js/technical/canvas.js?v=11.6.8"></script>
	<script src="js/technical/particleSystem.js?v=11.6.8"></script>
	<script src="js/utils/NumberFormating.js?v=11.6.8"></script>
	<script src="js/utils/options.js?v=11.6.8"></script>
	<script src="js/utils/save.js?v=11.6.8"></script>
	<script src="js/utils/themes.js?v=11.6.8"></script>
	<script src="js/easter-egg.js?v=11.6.8"></script>

</head>


<body onload="boot()" onmousemove="updateMouse(event)">
	<div id="boot"><div class="boot-text">正在加载方块树…</div></div>
	<div id="app">
		<div id="mc-title" v-if="player.tab === 'none'"><b>方块树</b><span>无尽模组海</span></div>
		<div id="mc-top-fade" v-if="player.tab === 'none'"></div>
		<canvas id="treeCanvas" class="canvas" v-if="!(tmp.gameEnded && !player.keepGoing)"></canvas>

		<div class="vl" v-if="player.navTab !== 'none' && tmp.other.splitScreen && player.tab!='none' && !(tmp.gameEnded && !player.keepGoing)"></div>
		<div v-if="(tmp.gameEnded && !player.keepGoing)" class="fullWidth winScreen" v-html="winScreenHTML()"></div>

		<div id="treeOverlay" v-if="!(tmp.gameEnded && !player.keepGoing) && (player.tab === 'none' || tmp.other.splitScreen || !readData(layoutInfo.showTree))" class="treeOverlay" onscroll="resizeCanvas()"
			v-bind:class="{ 
			fullWidth: (player.tab == 'none' || player.navTab == 'none'), 
			col: (player.tab !== 'none' && player.navTab !== 'none'), 
			left: (player.tab !== 'none' && player.navTab !== 'none')}"
			 :style="{'margin-top': !readData(layoutInfo.showTree) && player.tab == 'info-tab' ? '50px' : ''}">
			<div id="version" onclick="showTab('changelog-tab')" class="overlayThing" style="margin-right: 13px" >
				{{VERSION.withoutName}}</div>
			<button
			v-if="((player.navTab == 'none' && (tmp[player.tab].row == 'side' || tmp[player.tab].row == 'otherside' || player[player.tab].prevTab)) || player[player.navTab]?.prevTab)"				class="other-back overlayThing" onclick="goBack(player.navTab == 'none' ? player.tab : player.navTab)">←</button>
			<img id="optionWheel" class="overlayThing" v-if="player.tab!='options-tab'" src="options_wheel.png"
				onclick="showTab('options-tab')"></img>
			<div id="info" v-if="player.tab!='info-tab'" class="overlayThing" onclick="showTab('info-tab')"><br>i</div>
			<overlay-head v-if="!(tmp.gameEnded && !player.keepGoing)"></overlay-head>
			<div class="sideLayers">
				<div v-for="(node, index) in OTHER_LAYERS['side']">
					<tree-node :layer='node' :abb='tmp[node].symbol' :size="'small'" :key="'side' + index"></tree-node>
				</div>
			</div>
		</div>
		
		<div v-if="!(tmp.gameEnded && !player.keepGoing) && (player.tab === 'none' || tmp.other.splitScreen)" id="treeTab"  onscroll="resizeCanvas()" 
			v-bind:class="{ fullWidth: (player.tab == 'none' || player.navTab == 'none'), col: (player.tab !== 'none' && player.navTab !== 'none'), left: (player.tab !== 'none' && player.navTab !== 'none')}">
			<br><br><br><br>
			<overlay-head id="fakeHead" style="visibility: hidden;">
			</overlay-head>
			<layer-tab :layer="player.navTab == 'none' ? player.tab : player.navTab" :key="'left'"></layer-tab>
			<bg :layer="player.navTab == 'none' ? player.tab : player.navTab" ></bg>
		</div>

		<!-- Popups -->
		<div class="popup-container">
			<transition-group name="fade">
				<div v-for="popup,index in activePopups" class="popup" v-bind:class="popup.type"
					v-bind:key="'p' + popup.id" v-on:click="() => {activePopups.splice(index, 1)}" v-bind:style="popup.color ? {'background-color': popup.color} : {}">
					<h3>{{popup.title}}</h3><br>
					<h2 v-html="popup.message"></h2>
				</div>
			</transition-group>
		</div>
		<div class="particle-container">
				<div v-for="particle,index in particles">
					<particle :data="particle" :index="index" v-bind:key="'b' + particle.id"></particle>
				</div>
		</div>

		<div v-if="player.navTab !== 'none' && player.tab !== 'none' && !(tmp.gameEnded && !player.keepGoing)" onscroll="resizeCanvas()" v-bind:class="{ fullWidth: player.navTab == 'none' || !tmp.other.splitScreen || !readData(layoutInfo.showTree), col: player.navTab != 'none', right: player.navTab != 'none', fast: true, tab: true}">
			<div v-for="layer in LAYERS">
				<div v-if="player.tab==layer">
					<layer-tab :layer="layer" :back="'none'" :spacing="'50px'" :key="'left'"></layer-tab>
				</div>
			</div>
			<bg :layer="player.tab" ></bg>

		</div>
		<div class = "bg2" v-bind:style = "tmp.backgroundStyle"></div>

	</div>
</body>
</html>
