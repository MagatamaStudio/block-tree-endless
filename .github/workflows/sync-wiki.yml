name: Sync wiki changelog

on:
  push:
    branches: [main]
    paths:
      - js/mod.js
      - tools/sync-wiki-changelog.js
      - .github/workflows/sync-wiki.yml
  workflow_dispatch:

concurrency:
  group: sync-wiki-changelog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync wiki changelog
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "WIKI_TOKEN 未配置，跳过 wiki 同步。"
            exit 0
          fi
          node tools/sync-wiki-changelog.js
